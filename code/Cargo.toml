[package]
name = "json-xml-compare"
version = "1.0.0"
edition = "2021"
description = "Сравнение JSON и XML в интерфейсе в духе Discord"

[[bin]]
name = "SimpleJsonXmlComparator"
path = "src/main.rs"

[dependencies]
eframe = "0.32"
egui_extras = { version = "0.32", features = ["svg", "image"] }
serde_json = { version = "1", features = ["preserve_order"] }
roxmltree = "0.20"
similar = "2"
rfd = "0.15"

[build-dependencies]
resvg = "0.45"
tiny-skia = "0.11"
usvg = "0.45"
winresource = "0.1"
